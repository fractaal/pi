name: Publish npm packages

# The fork publishes the package family consumed by Pi and Aria. Standalone
# binaries, Nix releases, and the upstream pi.dev catalog are separate products
# and are not part of this workflow.
on:
  push:
    tags:
      - 'fractaal-v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g., fractaal-v0.84.0). Recovery reruns the same tag.'
        required: true
        type: string

permissions: {}

concurrency:
  group: publish-npm-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish-npm:
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      # The tag is the only publishable source. Full history is required so the
      # release commit's reachability from main can be proven, not assumed.
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release source
        id: release
        run: node scripts/verify-release-source.mjs "${RELEASE_TAG}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev fd-find ripgrep
          sudo ln -s "$(which fdfind)" /usr/local/bin/fd

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Builds from the committed model catalog. Regenerating it here would make
      # the published packages depend on live provider APIs rather than on the
      # verified release commit.
      - name: Build
        run: npm run build:offline

      - name: Check
        run: npm run check

      - name: Test published fork surface
        run: npm run test:published

      # Test the packages as they will be published: release:local applies the fork
      # identity to a staged copy, packs it, and installs it as a consumer would.
      - name: Smoke-test the fork packages as published
        run: npm run release:local -- --skip-check --skip-test --out "${RUNNER_TEMP}/fork-release-smoke"

      - name: Upgrade npm for trusted publishing
        run: |
          npm install -g npm@11.16.0 --ignore-scripts
          npm --version

      # The source tree keeps upstream package names so upstream merges remain
      # mechanical. Apply the fork identity only to the artifacts being published.
      - name: Apply fork packaging identity
        run: node scripts/fractal-identity.mjs "${RELEASE_VERSION}"

      # Last thing before the first irreversible side effect. The checkout holds
      # a tag snapshot fetched earlier; ask origin whether the public tag still
      # points at the commit being published.
      - name: Verify live remote release tag
        run: node scripts/verify-release-source.mjs "${RELEASE_TAG}" --remote

      - name: Publish npm packages
        run: node scripts/publish.mjs
